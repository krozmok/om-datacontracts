  - name: "client_id"
    dataType: "STRING"
    dataLength: 1
    dataTypeDisplay: "string"
    fullyQualifiedName: "TEST.488022034671.cencosud_regional_customer_analytics_dev.dim_customer.customer_id"
    description: "Identificador único del cliente consolidado entre fuentes"
    tags: []
    children: []

# -------------------------------------------------------
# SEMANTICS: reglas de negocio (SemanticsRule)
# -------------------------------------------------------
semantics:
  - name: "Propietario asignado"
    description: "La tabla debe tener al menos un owner asignado"
    rule: '{"and":[{"some":[{"var":"owners"},{"!=":[{"var":"fullyQualifiedName"},null]}]}]}'
    enabled: true

