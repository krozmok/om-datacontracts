# refreshFrequency.unit: hour | day | week | month | year
# maxLatency.unit: minute | hour | day
# -------------------------------------------------------
sla:
  refreshFrequency:
    interval: 1
    unit: "day"

# -------------------------------------------------------
# SCHEMA: subconjunto representativo de columnas críticas
# Solo columnas que el contrato debe garantizar.
# dataType válidos (OM): STRING, INT, BIGINT, FLOAT, DOUBLE,
#   BOOLEAN, DATE, DATETIME, TIMESTAMP, etc.
# -------------------------------------------------------
schema:
